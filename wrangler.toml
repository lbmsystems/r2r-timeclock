name = "r2r-timeclock"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# Settings added in the Cloudflare dashboard (ACCESS_TEAM_DOMAIN, ACCESS_AUD,
# ADMIN_EMAILS) survive deploys from this repo.
keep_vars = true

# The kiosk page (/) and the owners' dashboard (/admin/). Requests for
# /api/* and /admin/api/* reach the Worker first; everything else is served
# straight from public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*", "/admin/api/*"]

[observability]
enabled = true
