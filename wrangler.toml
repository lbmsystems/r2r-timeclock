name = "r2r-timeclock"
main = "src/worker.js"
compatibility_date = "2025-09-01"

# The kiosk page. Requests for /api/* reach the Worker first; everything
# else is served straight from public/.
[assets]
directory = "./public"
binding = "ASSETS"
run_worker_first = ["/api/*"]

[observability]
enabled = true
